[package]
name = "all-db-benchctl"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4.3"
nix = { version = "0.30", default-features = false, features = ["feature", "time"] }
regex = "1.12"
rustix = { version = "1.1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
