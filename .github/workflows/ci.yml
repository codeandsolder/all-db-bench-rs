name: CI

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust validation (shared sccache)
    permissions:
      contents: read
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@21aa933d276f9193e50d4047ea25da6b467337dc # main
    with:
      rust-toolchain: "nightly-2026-11-19"
      rust-components: "rustfmt clippy"
      rustflags: "-C target-cpu=x86-64-v2 -C target-feature=+aes,+sse2"
      timeout-minutes: 90
      sccache-cache-size-mib: 6144
      command: |
        cargo fmt --all -- --check
        cargo fmt --manifest-path engines/surrealdb-rocksdb/Cargo.toml -- --check
        bash -n scripts/*.sh deploy/rental/*.sh
        ./scripts/test-rental-deployment.sh
        ./scripts/test-record-semantics.sh
        ./scripts/test-no-python-tooling.sh

        cargo test --locked --workspace --all-targets
        cargo clippy --locked --workspace --all-targets -- -D warnings

        cargo test --locked -p rust-db-realistic-bench --all-targets --features record
        cargo clippy --locked -p rust-db-realistic-bench --all-targets --features record -- -D warnings
        cargo test --locked -p rust-db-realistic-bench --all-targets --features kv-all
        cargo clippy --locked -p rust-db-realistic-bench --all-targets --features kv-all -- -D warnings

        cargo test --locked --manifest-path engines/surrealdb-rocksdb/Cargo.toml --all-targets
        cargo clippy --locked --manifest-path engines/surrealdb-rocksdb/Cargo.toml --all-targets -- -D warnings
