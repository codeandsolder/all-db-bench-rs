[package]
name = "all-db-bench-record-harness"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
all-db-bench-common = { path = "../bench-common" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hdrhistogram = "7"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[lints]
workspace = true
