[workspace]
members = [
    ".",
    "crates/bench-common",
    "crates/record-harness",
    "engines/tsdb-server",
    "tools/benchctl",
]
exclude = ["engines/surrealdb-rocksdb"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[package]
name = "rust-db-realistic-bench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "recordbench"
path = "src/bin/recordbench.rs"
required-features = ["record"]

[[bin]]
name = "recordconcurrency"
path = "src/bin/recordconcurrency.rs"
required-features = ["record"]

[[bin]]
name = "recordsustained"
path = "src/bin/recordsustained.rs"
required-features = ["record"]

[features]
kv-external = ["dep:rocksdb", "dep:libmdbx", "dep:persy"]
kv-experimental = ["dep:roughdb", "dep:jammdb", "dep:lsm-db"]
kv-all = ["kv-external", "kv-experimental"]
record = ["dep:all-db-bench-record-harness", "dep:surrealdb", "dep:turso", "dep:rusqlite", "surrealdb/kv-surrealkv"]

[dependencies]
all-db-bench-common = { path = "crates/bench-common" }
all-db-bench-record-harness = { path = "crates/record-harness", optional = true }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hdrhistogram = "7"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

redb = "=4.4.0"
fjall = "=3.1.12"
surrealkv = { version = "=1.0.0", default-features = false }
heed = "=0.22.1"
sled = "=1.0.0-alpha.124"
lkv = "=0.2.1"
manifold-db = "=3.1.0"
turbokv = "=0.6.0"
parity-db = "=0.5.7"

surrealdb = { version = "=3.3.5", optional = true, default-features = false }
turso = { version = "=0.8.3", optional = true, default-features = false }
rocksdb = { version = "=0.25.0", optional = true, default-features = false, features = ["bindgen-runtime", "lz4", "snappy", "zstd"] }
libmdbx = { version = "=0.9.0", optional = true }
persy = { version = "=1.8.1", optional = true, features = ["background_ops"] }
rusqlite = { version = "=0.40.2", optional = true, default-features = false }
roughdb = { version = "=0.11.1", optional = true }
jammdb = { version = "=0.11.0", optional = true }
lsm-db = { version = "=1.1.0", optional = true, features = ["durability", "bloom"] }

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1

[lints]
workspace = true
