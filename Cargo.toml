[package]
name = "rust-db-realistic-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"

[features]
default = ["kv"]
kv = []
kv-external = ["dep:rocksdb", "dep:libmdbx", "dep:persy"]
kv-experimental = ["dep:roughdb", "dep:jammdb", "dep:lsm-db"]
kv-all = ["kv-external", "kv-experimental"]
record = ["dep:surrealdb", "dep:turso", "dep:rusqlite", "surrealdb/kv-surrealkv"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hdrhistogram = "7"
rand = { version = "0.9", features = ["small_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

redb = "=4.3.0"
fjall = "=3.1.12"
surrealkv = "=0.21.4"
heed = "=0.22.1"
sled = "=1.0.0-alpha.124"
lkv = "=0.2.1"
manifold-db = "=3.1.0"
turbokv = "=0.6.0"
parity-db = "=0.5.7"

surrealdb = { version = "=3.3.2", optional = true, default-features = false }
turso = { version = "=0.8.2-pre.2", optional = true, default-features = false }
rocksdb = { version = "=0.25.0", optional = true, default-features = false, features = ["bindgen-runtime"] }
libmdbx = { version = "=0.9.0", optional = true }
persy = { version = "=1.8.1", optional = true, features = ["background_ops"] }
rusqlite = { version = "=0.40.2", optional = true, default-features = false }
roughdb = { version = "=0.10.1", optional = true }
jammdb = { version = "=0.11.0", optional = true }
lsm-db = { version = "=1.0.0", optional = true, features = ["durability", "bloom"] }

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1
