[package]
name = "surrealdb-rocksdb-recordbench"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[dependencies]
all-db-bench-common = { path = "../../crates/bench-common" }
all-db-bench-record-harness = { path = "../../crates/record-harness" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
surrealdb = { version = "=3.3.5", default-features = false, features = ["kv-rocksdb"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[workspace]
