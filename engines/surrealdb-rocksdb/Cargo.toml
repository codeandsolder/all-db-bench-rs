[package]
name = "surrealdb-rocksdb-recordbench"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hdrhistogram = "7"
rand = { version = "0.9", features = ["small_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
surrealdb = { version = "=3.3.0", default-features = false, features = ["kv-rocksdb"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1
