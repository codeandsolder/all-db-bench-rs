[package]
name = "tsdb-server-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hdrhistogram = "7"
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snap = "1"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1
