[package]
name = "tsdb-server-bench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
all-db-bench-common = { path = "../../crates/bench-common" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hdrhistogram = "7"
prost = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "form", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snap = "1"

[lints]
workspace = true
